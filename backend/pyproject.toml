[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlr8-backend"
version = "0.1.0"
description = "FastAPI + Strawberry GraphQL backend for the Xlr8 Indian hospital CEO cockpit prototype."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "strawberry-graphql[fastapi]>=0.230",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.50",
  "httpx>=0.27",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "prophet>=1.1",
  "transformers>=4.0",
  "torch>=2.0",
  "faker>=28.0",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.setuptools]
py-modules = ["main", "settings", "db", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphql_app*", "concierge*", "services*", "ml*", "data_gen*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"services/business_impact.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
